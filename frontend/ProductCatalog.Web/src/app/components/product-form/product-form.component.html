<div class="form-container">
  <h2>Dodaj nowy produkt</h2>
  
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="code">Kod produktu</label>
      <input type="text" id="code" [(ngModel)]="product.code" name="code" required>
    </div>

    <div class="form-group">
      <label for="name">Nazwa</label>
      <input type="text" id="name" [(ngModel)]="product.name" name="name" required>
    </div>

    <div class="form-group">
      <label for="price">Cena (PLN)</label>
      <input type="number" id="price" [(ngModel)]="product.price" name="price" min="0" step="0.01">
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Dodawanie...' : 'Dodaj produkt' }}
    </button>
  </form>
</div>
